<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYZ Cafe - Smart Lighting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-icon">☕</span>
        <h1>XYZ Café</h1>
      </div>
      <div class="nav-links">
        <a href="#moods" class="nav-link">Moods</a>
        <a href="#settings" class="nav-link">Settings</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2>Smart Lighting</h2>
      <p>Premium ambiance at your fingertips</p>
    </div>
    
    <!-- Quick Controls -->
    <div class="hero-controls">
      <button id="enableIrBtn" class="btn btn-control btn-enable">
        <span class="icon">📡</span>
        <span>Enable IR</span>
      </button>
      <button id="disableIrBtn" class="btn btn-control btn-disable">
        <span class="icon">📵</span>
        <span>Disable IR</span>
      </button>
    </div>
  </section>

  <!-- Main Container -->
  <div class="container">
    <!-- Settings Panel -->
    <section id="settings" class="settings-panel">
      <div class="settings-grid">
        <div class="setting-card">
          <label for="backendUrl" class="setting-label">Backend URL</label>
          <input id="backendUrl" type="text" value="http://localhost:3000" class="setting-input"/>
        </div>
        <div class="setting-card">
          <label for="espIp" class="setting-label">ESP IP Address</label>
          <input id="espIp" type="text" value="http://192.168.170.87" class="setting-input"/>
        </div>
        <div class="setting-card">
          <label for="multiSpeedSlider" class="setting-label">Multi Transition Speed (ms)</label>
          <div class="setting-row">
            <input id="multiSpeedSlider" type="range" min="3" max="200" value="15" step="1" />
            <span id="multiSpeedValue">15 ms</span>
          </div>
        </div>
        <div class="setting-card">
          <button id="refresh" class="btn btn-primary">🔄 Refresh</button>
        </div>
      </div>
    </section>

    <!-- Moods Section -->
    <section class="moods-section">
      <div class="moods-header">
        <h2>✨ Moods</h2>
      </div>
      <div id="moodsGrid" class="moods-grid"></div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 XYZ Café. Ambient lighting control system.</p>
  </footer>

  <!-- Custom Modal -->
  <div id="modalOverlay" class="modal-overlay"></div>
  <div id="customModal" class="custom-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body">
        <p id="modalMessage">Modal message</p>
      </div>
      <div class="modal-footer" id="modalFooter">
        <button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
  // Custom Modal System
  const modal = {
    overlay: document.getElementById('modalOverlay'),
    container: document.getElementById('customModal'),
    title: document.getElementById('modalTitle'),
    message: document.getElementById('modalMessage'),
    footer: document.getElementById('modalFooter'),
    confirmBtn: document.getElementById('modalConfirmBtn'),
    cancelBtn: document.getElementById('modalCancelBtn'),
    closeBtn: document.getElementById('modalCloseBtn'),
    resolve: null,

    show(options = {}) {
      this.title.textContent = options.title || 'Notice';
      this.message.textContent = options.message || '';
      
      const hasConfirm = options.type === 'confirm';
      this.footer.style.display = hasConfirm ? 'flex' : 'none';
      
      if (hasConfirm) {
        this.confirmBtn.textContent = options.confirmText || 'Confirm';
        this.cancelBtn.textContent = options.cancelText || 'Cancel';
      }

      const icon = options.icon || '';
      if (icon) {
        this.title.textContent = icon + ' ' + this.title.textContent;
      }

      this.overlay.classList.add('active');
      this.container.classList.add('active');

      return new Promise((resolve) => {
        this.resolve = resolve;
      });
    },

    close(result = false) {
      this.overlay.classList.remove('active');
      this.container.classList.remove('active');
      if (this.resolve) {
        this.resolve(result);
        this.resolve = null;
      }
    },

    alert(message, title = 'Alert') {
      return this.show({ title, message, icon: 'ℹ️' });
    },

    success(message, title = 'Success') {
      return this.show({ title, message, icon: '✓' });
    },

    error(message, title = 'Error') {
      return this.show({ title, message, icon: '❌' });
    }
  };

  modal.closeBtn.addEventListener('click', () => modal.close(false));
  modal.overlay.addEventListener('click', () => modal.close(false));
  modal.cancelBtn.addEventListener('click', () => modal.close(false));
  modal.confirmBtn.addEventListener('click', () => modal.close(true));

  function getBackend() { return document.getElementById('backendUrl').value.trim(); }
  function getESP() { return document.getElementById('espIp').value.trim(); }

  async function fetchMoods() {
    const url = getBackend() + '/moods';
    try {
      const res = await fetch(url);
      const moods = await res.json();
      renderMoods(moods);
    } catch (err) {
      document.getElementById('moodsGrid').innerHTML = '<p class="error-message">Failed to load moods: ' + err + '</p>';
    }
  }

  function createColorLabel(c) {
    if (!c || typeof c !== 'object') return 'rgb(0, 0, 0)';
    const r = (typeof c.r === 'number') ? c.r : 0;
    const g = (typeof c.g === 'number') ? c.g : 0;
    const b = (typeof c.b === 'number') ? c.b : 0;
    return `rgb(${r}, ${g}, ${b})`;
  }

  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : { r: 0, g: 0, b: 0 };
  }

  function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  }

  function renderMoods(moods) {
    const container = document.getElementById('moodsGrid');
    container.innerHTML = '';
    
    if (!moods || moods.length === 0) {
      container.innerHTML = '<p class="no-moods">No moods available. Create one in the admin panel!</p>';
      return;
    }

    moods.forEach(m => {
      const moodCard = document.createElement('div');
      moodCard.className = 'mood-card';
      
      const singleColor = createColorLabel(m.singleColor || { r:0, g:0, b:0 });
      const multiColorsArray = Array.isArray(m.multiColors) && m.multiColors.length > 0 ? m.multiColors : [{r:0,g:0,b:0}];
      
      // Create color swatches HTML
      let swatchesHTML = '<div class="mood-swatches">';
      multiColorsArray.forEach(color => {
        const colorStr = createColorLabel(color);
        swatchesHTML += `<div class="swatch" style="background: ${colorStr}"></div>`;
      });
      swatchesHTML += '</div>';
      
      moodCard.innerHTML = `
        <div class="mood-info">
          <h3 class="mood-name">${m.name}</h3>
          <div class="mood-color-info">
            <span class="mood-label">Single</span>
            <span class="mood-color-text">${singleColor}</span>
          </div>
        </div>
        ${swatchesHTML}
        <div class="mood-actions">
          <button class="btn btn-mood btn-single" data-color='${JSON.stringify(m.singleColor || { r:0,g:0,b:0 })}'>
            💡 Send
          </button>
          <button class="btn btn-mood btn-multi" data-colors='${JSON.stringify(multiColorsArray)}'>
            🌈 Play
          </button>
        </div>
      `;
      
      const singleBtn = moodCard.querySelector('.btn-single');
      const multiBtn = moodCard.querySelector('.btn-multi');
      
      singleBtn.onclick = () => {
        const color = JSON.parse(singleBtn.getAttribute('data-color'));
        sendSingle(color);
      };
      
      multiBtn.onclick = () => {
        const colors = JSON.parse(multiBtn.getAttribute('data-colors'));
        sendMulti(colors);
      };
      
      container.appendChild(moodCard);
    });
  }

  async function sendSingle(color) {
    const esp = getESP();
    try {
      const res = await fetch(esp + '/color/single', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(color)
      });
      await modal.success('Color sent to lamp!', 'Success');
    } catch (err) {
      await modal.error('Failed to contact ESP. Check ESP IP and connection.', 'Connection Error');
    }
  }

  async function sendMulti(colors) {
    const esp = getESP();
    try {
      const res = await fetch(esp + '/color/multi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ colors })
      });
      await modal.success('Multi-color sequence sent!', 'Success');
    } catch (err) {
      await modal.error('Failed to contact ESP. Check ESP IP and connection.', 'Connection Error');
    }
  }

  async function enableIR() {
    const esp = getESP();
    try {
      await fetch(esp + '/ir/on');
      await modal.success('Infrared control enabled', 'Success');
    } catch (err) {
      await modal.error('Failed to enable IR: ' + err, 'Error');
    }
  }

  async function disableIR() {
    const esp = getESP();
    try {
      await fetch(esp + '/ir/off');
      await modal.success('Infrared control disabled', 'Success');
    } catch (err) {
      await modal.error('Failed to disable IR: ' + err, 'Error');
    }
  }

  // Transition speed control for multi-color animations
  const multiSpeedSlider = document.getElementById('multiSpeedSlider');
  const multiSpeedValue = document.getElementById('multiSpeedValue');

  function sendSpeedToESP(ms) {
    const esp = getESP();
    if (!esp) return;
    fetch(esp + '/color/speed', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ms: Number(ms) })
    }).then(async res => {
      if (!res.ok) console.warn('Failed to set speed on ESP', await res.text());
    }).catch(err => console.warn('Failed to set speed on ESP', err));
  }

  if (multiSpeedSlider) {
    multiSpeedSlider.addEventListener('input', (e) => {
      multiSpeedValue.innerText = `${e.target.value} ms`;
    });
    multiSpeedSlider.addEventListener('change', (e) => {
      sendSpeedToESP(e.target.value);
    });
  }

  document.getElementById('refresh').onclick = fetchMoods;
  document.getElementById('enableIrBtn').onclick = enableIR;
  document.getElementById('disableIrBtn').onclick = disableIR;
  
  fetchMoods();
  if (multiSpeedSlider) sendSpeedToESP(Number(multiSpeedSlider.value));
  </script>
</body>
</html>
